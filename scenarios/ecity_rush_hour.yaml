# E-City, rush hour: 26 delivery requests in the first minute (one every ~2 s) from two hubs of three pads each, to six drop
# points, so the Planner has to spread them over the height layers and delay the ones that do not fit. A zone closes a
# block south of the middle at 45 s for 3 min, an intruder crosses at 40 s, the Hospital files an emergency at 60 s.
# Hubs, pads and drop points are at least 10 m from the nearest building. Needs --slots 30 on the live server.
# Run: python scripts/run_scenario.py scenarios/ecity_rush_hour.yaml
name: ecity_rush_hour
seed: 20
map: {map: osm-full}
places:
  West Hub:      {kind: hub, operator: op0, pads: [[-30.0, 15.0], [-24.0, 15.0], [-18.0, 15.0]]}
  East Hub:      {kind: hub, operator: op1, pads: [[150.0, 23.0], [156.0, 23.0], [162.0, 23.0]]}
  City Hospital: {kind: hospital, at: [72.7, -78.6]}
  Apartments:    {kind: drop, at: [-41.6, -88.0]}
  School:        {kind: drop, at: [1.7, -142.0]}
  Clinic:        {kind: drop, at: [20.9, -59.3]}
  Market:        {kind: drop, at: [35.4, 90.7]}
  Pharmacy:      {kind: drop, at: [52.9, 24.5]}
  Tech Park:     {kind: drop, at: [60.4, -183.3]}
  Incident Site: {kind: drop, at: [38.2, -6.4]}
requests:
  - {t: 5.3, operator: op0, to: Tech Park}
  - {t: 7.2, operator: op1, to: Incident Site}
  - {t: 9.9, operator: op0, to: Tech Park}
  - {t: 12.2, operator: op1, to: Tech Park}
  - {t: 13.6, operator: op0, to: School}
  - {t: 16.1, operator: op1, to: Pharmacy}
  - {t: 18.4, operator: op0, to: Pharmacy}
  - {t: 20.0, operator: op1, to: School}
  - {t: 22.6, operator: op0, to: School}
  - {t: 24.8, operator: op1, to: Tech Park}
  - {t: 26.5, operator: op0, to: Tech Park}
  - {t: 28.2, operator: op1, to: Clinic}
  - {t: 29.9, operator: op0, to: School}
  - {t: 31.5, operator: op1, to: Market}
  - {t: 33.1, operator: op0, to: Apartments}
  - {t: 35.1, operator: op1, to: Pharmacy}
  - {t: 36.5, operator: op0, to: Market}
  - {t: 38.2, operator: op1, to: Pharmacy}
  - {t: 41.0, operator: op0, to: Pharmacy}
  - {t: 43.6, operator: op1, to: Clinic}
  - {t: 45.4, operator: op0, to: Pharmacy}
  - {t: 47.6, operator: op1, to: Incident Site}
  - {t: 49.9, operator: op0, to: Pharmacy}
  - {t: 52.6, operator: op1, to: Incident Site}
  - {t: 54.2, operator: op0, to: School}
  - {t: 56.1, operator: op1, to: Clinic}
demand:
  duration_s: 70
  layers: [6, 7]
  short_trip_m: 105
  short_layers: [2, 3]
disruptions: {p_late: 0.2, late: [5, 15], p_slow: 0.0, slow: 0.6}
intruders:
  - {t: 40, start: [23.0, 60.0], goal: [-18.0, 22.0], layer: 6}
zones:
  - {at: 45, for: 180, polygon: [[-10, -122], [45, -122], [45, -92], [-10, -92]]}
emergencies:
  - {t: 60, from: City Hospital, to: Incident Site, priority: 1, layer: 7, operator: Hospital}
utm: {mode: e4, risk: booking, telemetry: null, layer_floor: 1, n_layers: 8, layers_open: [2, 3, 6, 7],
      layer_penalty: 30, max_delay: 120, traffic_detour: true, inflate: 1.15, v_climb: 1.0, v_descent: 0.5,
      v_descent_high: 1.0, slow_band_m: 3.0}
sim: {cruise_z_bias: 0.9, altitude_cap: 3.5, land_step_m: 2.0, position_origin: goal,
      hold_engage_m: 1.0, land_vz_high: 1.0, land_slow_m: 3.0, los_below_cruise: true}
record: eval_results/scenarios/ecity_rush_hour.json.gz
